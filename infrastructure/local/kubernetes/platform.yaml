---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: spark-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
      - name: airflow
        image: company-airflow:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 2500Mi
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: 'false'
        - name: AIRFLOW__CORE__EXECUTOR
          value: LocalExecutor
        - name: AIRFLOW__CORE__PARALLELISM
          value: '2'
        - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
          value: 'false'
        - name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS
          value: admin:admin
        - name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE
          value: /opt/airflow/data/passwords.json
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: /opt/company-live/dags
        - name: PYTHONPATH
          value: /opt/company-live
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: sqlite:////opt/airflow/data/airflow.db
        - name: AIRFLOW__LOGGING__BASE_LOG_FOLDER
          value: /opt/airflow/data/logs
        - name: AIRFLOW__API__BASE_URL
          value: http://localhost:8080
        - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
          value: http://localhost:8080/execution/
        - name: AIRFLOW__API_AUTH__JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: airflow-auth
              key: jwt-secret
        - name: COMPANY_WHEEL_SHA256
          valueFrom:
            configMapKeyRef:
              name: ingestion-release
              key: sha256
        command:
        - /bin/bash
        - -ec
        args:
        - cp /opt/airflow/auth/passwords.json /opt/airflow/data/passwords.json; exec
          airflow standalone
        volumeMounts:
        - name: data
          mountPath: /opt/airflow/data
        - name: auth
          mountPath: /opt/airflow/auth
          readOnly: true
        - name: live-code
          mountPath: /opt/company-live
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/v2/monitor/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: airflow-data
      - name: auth
        secret:
          secretName: airflow-auth
          items:
          - key: passwords.json
            path: passwords.json
      - name: live-code
        configMap:
          name: airflow-live-code
          items:
          - key: company_airflow____init__.py
            path: company_airflow/__init__.py
          - key: company_airflow__application.py
            path: company_airflow/application.py
          - key: company_airflow__hooks____init__.py
            path: company_airflow/hooks/__init__.py
          - key: company_airflow__hooks__kubernetes_job.py
            path: company_airflow/hooks/kubernetes_job.py
          - key: company_airflow__hooks__spark_kubernetes.py
            path: company_airflow/hooks/spark_kubernetes.py
          - key: company_airflow__ingestion.py
            path: company_airflow/ingestion.py
          - key: company_airflow__job.py
            path: company_airflow/job.py
          - key: company_airflow__operators____init__.py
            path: company_airflow/operators/__init__.py
          - key: company_airflow__operators__adaptive_ingestion.py
            path: company_airflow/operators/adaptive_ingestion.py
          - key: company_airflow__operators__enterprise_ingestion.py
            path: company_airflow/operators/enterprise_ingestion.py
          - key: company_airflow__operators__enterprise_k8s.py
            path: company_airflow/operators/enterprise_k8s.py
          - key: company_airflow__operators__spark.py
            path: company_airflow/operators/spark.py
          - key: company_airflow__status.py
            path: company_airflow/status.py
          - key: company_airflow__triggers____init__.py
            path: company_airflow/triggers/__init__.py
          - key: company_airflow__triggers__job.py
            path: company_airflow/triggers/job.py
          - key: company_airflow__triggers__spark.py
            path: company_airflow/triggers/spark.py
          - key: dags__company_ingestion_benchmark.py
            path: dags/company_ingestion_benchmark.py
          - key: dags__company_ingestion_dlt_benchmark.py
            path: dags/company_ingestion_dlt_benchmark.py
          - key: dags__company_ingestion_dlt_distributed.py
            path: dags/company_ingestion_dlt_distributed.py
          - key: dags__company_ingestion_oracle_adaptive.py
            path: dags/company_ingestion_oracle_adaptive.py
      serviceAccountName: airflow
      securityContext:
        fsGroup: 0
