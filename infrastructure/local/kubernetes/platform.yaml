  company_airflow__application.py: "\"\"\"Build native Apache SparkApplication objects\
    \ from an execution request.\"\"\"\nfrom copy import deepcopy\nimport hashlib\n\
    import json\nimport re\n\nPROFILES = {\n    \"small\": {\"driver_cores\": 1, \"\
    driver_memory\": \"1g\", \"executors\": 2,\n              \"executor_cores\":\
    \ 1, \"executor_memory\": \"1g\"},\n    \"medium\": {\"driver_cores\": 1, \"driver_memory\"\
    : \"1g\", \"executors\": 2,\n               \"executor_cores\": 2, \"executor_memory\"\
    : \"2g\"},\n}\n\n\ndef execution_name(dag_id: str, task_id: str, run_id: str,\
    \ try_number: int) -> str:\n    identity = json.dumps([dag_id, task_id, run_id,\
    \ try_number], separators=(\",\", \":\"))\n    digest = hashlib.sha256(identity.encode()).hexdigest()[:16]\n\
    \    stem = re.sub(\"[^a-z0-9-]\", \"-\", task_id.lower()).strip(\"-\")[:35] or\
    \ \"job\"\n    return f\"company-{stem}-{digest}\"\n\n\ndef secret_env(name: str,\
    \ secret: str, key: str) -> dict:\n    return {\"name\": name, \"valueFrom\":\
    \ {\"secretKeyRef\": {\"name\": secret, \"key\": key}}}\n\n\ndef build_application(*,\
    \ name: str, namespace: str, runtime: str, spark_version: str,\n             \
    \         wheel_url: str, parameters: dict, compute_profile: str,\n          \
    \            wheel_sha256: str | None = None, spark_conf: dict | None = None,\n\
    \                      entrypoint: str = \"company_ingestion.entrypoint:main\"\
    ) -> dict:\n    if compute_profile not in PROFILES:\n        raise ValueError(f\"\
    Unknown compute profile {compute_profile!r}; choose {list(PROFILES)}\")\n    resources\
    \ = PROFILES[compute_profile]\n    config = deepcopy(parameters)\n    config[\"\
    run_id\"] = name\n    config[\"profile\"] = compute_profile\n    config.setdefault(\"\
    planner\", {})[\"task_slots\"] = resources[\"executors\"] * resources[\"executor_cores\"\
    ]\n    env = [\n        {\"name\": \"COMPANY_EXECUTION_CONFIG\", \"value\": json.dumps(config,\
    \ separators=(\",\", \":\"))},\n        {\"name\": \"COMPANY_WHEEL_URL\", \"value\"\
    : wheel_url},\n        {\"name\": \"COMPANY_ENTRYPOINT\", \"value\": entrypoint},\n\
    \        secret_env(\"SQLSERVER_USER\", \"sqlserver-credentials\", \"username\"\
    ),\n        secret_env(\"SQLSERVER_PASSWORD\", \"sqlserver-credentials\", \"password\"\
    ),\n        secret_env(\"AWS_ACCESS_KEY_ID\", \"seaweedfs-credentials\", \"access_key\"\
    ),\n        secret_env(\"AWS_SECRET_ACCESS_KEY\", \"seaweedfs-credentials\", \"\
    secret_key\"),\n        {\"name\": \"AWS_REGION\", \"value\": \"us-east-1\"},\n\
    \    ]\n    if wheel_sha256:\n        env.append({\"name\": \"COMPANY_WHEEL_SHA256\"\
    , \"value\": wheel_sha256})\n    conf = {\n        \"spark.app.name\": name,\n\
    \        \"spark.kubernetes.namespace\": namespace,\n        \"spark.kubernetes.container.image\"\
    : runtime,\n        \"spark.kubernetes.container.image.pullPolicy\": \"IfNotPresent\"\
    ,\n        \"spark.kubernetes.authenticate.driver.serviceAccountName\": \"spark\"\
    ,\n        \"spark.driver.cores\": str(resources[\"driver_cores\"]),\n       \
