    \ or {}),\n        \"validation\": deepcopy(validation or {}),\n        \"_orchestration\"\
    : {\n            \"image\": image,\n            \"namespace\": namespace,\n  \
    \          \"worker_service_account\": worker_service_account,\n            \"\
    worker_resources\": deepcopy(JOB_PROFILES.get(compute_profile, {})),\n       \
    \     \"worker_env\": worker_env,\n            \"secret_env\": secrets,\n    \
    \        \"timeout_seconds\": timeout_seconds,\n            \"workload_identity\"\
    : bool(workload_identity),\n        },\n    }\n"
  company_airflow__job.py: "\"\"\"Build generic Kubernetes Jobs for containerized\
    \ enterprise workloads.\"\"\"\nfrom copy import deepcopy\nimport hashlib\nimport\
    \ json\nimport re\nfrom collections.abc import Mapping\n\nJOB_PROFILES = {\n \
    \   \"small\": {\"cpu\": \"1\", \"memory\": \"2Gi\"},\n    \"medium\": {\"cpu\"\
    : \"4\", \"memory\": \"6Gi\"},\n}\n\n\ndef job_name(dag_id, task_id, run_id, try_number):\n\
    \    identity = json.dumps([dag_id, task_id, run_id, try_number], separators=(\"\
    ,\", \":\"))\n    digest = hashlib.sha256(identity.encode()).hexdigest()[:16]\n\
    \    stem = re.sub(\"[^a-z0-9-]\", \"-\", task_id.lower()).strip(\"-\")[:35] or\
    \ \"job\"\n    return f\"enterprise-{stem}-{digest}\"\n\n\ndef build_job(*, name,\
    \ namespace, image, configuration, compute_profile=\"small\",\n              command=None,\
    \ arguments=None, env=None, secret_env=None,\n              timeout_seconds=3600,\
    \ service_account_name=None, backoff_limit=0,\n              execution_profile=None):\n\
    \    if compute_profile not in JOB_PROFILES:\n        raise ValueError(f\"Unknown\
    \ compute profile {compute_profile!r}; choose {list(JOB_PROFILES)}\")\n    if\
    \ not isinstance(configuration, Mapping):\n        raise ValueError(\"configuration\
    \ must be a mapping\")\n    if env is not None and not isinstance(env, Mapping):\n\
    \        raise ValueError(\"env must be a mapping\")\n    if not isinstance(image,\
    \ str) or not image.strip():\n        raise ValueError(\"image must be a non-empty\
    \ string\")\n    resources = JOB_PROFILES[compute_profile]\n    config = deepcopy(configuration)\n\
    \    config[\"run_id\"] = name\n    config[\"profile\"] = execution_profile or\
    \ compute_profile\n    container_env = [{\"name\": \"COMPANY_JOB_CONFIG\", \"\
    value\": json.dumps(config, separators=(\",\", \":\"))}]\n    container_env.extend({\"\
    name\": key, \"value\": str(value)} for key, value in (env or {}).items())\n \
    \   for item in secret_env or []:\n        if not isinstance(item, Mapping) or\
    \ set(item) != {\"name\", \"secret\", \"key\"}:\n            raise ValueError(\"\
    Each secret_env entry must contain only name, secret and key\")\n        if not\
    \ all(isinstance(item[key], str) and item[key] for key in (\"name\", \"secret\"\
    , \"key\")):\n            raise ValueError(\"secret_env name, secret and key must\
    \ be non-empty strings\")\n        container_env.append({\"name\": item[\"name\"\
    ], \"valueFrom\": {\n            \"secretKeyRef\": {\"name\": item[\"secret\"\
    ], \"key\": item[\"key\"]}}})\n    container = {\n        \"name\": \"job\", \"\
    image\": image, \"imagePullPolicy\": \"IfNotPresent\",\n        \"env\": container_env,\n\
    \        \"resources\": {\"requests\": resources, \"limits\": resources},\n  \
    \      \"securityContext\": {\"allowPrivilegeEscalation\": False, \"capabilities\"\
    : {\"drop\": [\"ALL\"]}},\n    }\n    if command:\n        container[\"command\"\
    ] = command\n    if arguments:\n        container[\"args\"] = arguments\n    labels\
    \ = {\"app.kubernetes.io/managed-by\": \"company-airflow\", \"company-run\": name,\n\
    \              \"company-profile\": compute_profile, \"company-workload\": \"\
    enterprise-job\"}\n    return {\n        \"apiVersion\": \"batch/v1\", \"kind\"\
    : \"Job\",\n        \"metadata\": {\"name\": name, \"namespace\": namespace, \"\
    labels\": labels},\n        \"spec\": {\n            \"backoffLimit\": backoff_limit,\n\
    \            \"activeDeadlineSeconds\": timeout_seconds,\n            \"ttlSecondsAfterFinished\"\
    : 86400,\n            \"template\": {\"metadata\": {\"labels\": labels}, \"spec\"\
    : {\n                \"restartPolicy\": \"Never\", \"containers\": [container],\n\
    \                **({\"serviceAccountName\": service_account_name}\n         \
    \          if service_account_name else {})}},\n        },\n    }\n\n\ndef job_result(job):\n\
    \    status = job.get(\"status\") or {}\n    if status.get(\"succeeded\", 0) >\
    \ 0:\n        return {\"status\": \"success\", \"state\": \"Succeeded\", \"message\"\
    : \"Kubernetes Job completed\"}\n    if status.get(\"failed\", 0) > 0:\n     \
    \   message = \"Kubernetes Job failed\"\n        for condition in status.get(\"\
    conditions\") or []:\n            if condition.get(\"type\") == \"Failed\":\n\
    \                message = condition.get(\"message\") or condition.get(\"reason\"\
    ) or message\n        return {\"status\": \"error\", \"state\": \"Failed\", \"\
    message\": message}\n    return None\n"
