        - -ip.bind=0.0.0.0
        - -master.volumeSizeLimitMB=128
        - -volume.max=256
        - -s3
        - -s3.port=8333
        - -s3.config=/etc/seaweedfs/s3.json
        volumeMounts:
        - name: data
          mountPath: /data
        - name: auth
          mountPath: /etc/seaweedfs
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 8333
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-data
      - name: auth
        secret:
          secretName: seaweedfs-auth
