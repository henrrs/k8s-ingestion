  company_airflow__status.py: "\"\"\"Apache spark.apache.org/v1 status, deliberately\
    \ independent of Kubeflow APIs.\"\"\"\n\nFAILURES = {\n    \"Failed\", \"DriverStartTimedOut\"\
    , \"DriverReadyTimedOut\", \"ExecutorsStartTimedOut\",\n    \"SchedulingFailure\"\
    , \"DriverEvicted\",\n}\nTERMINATED = {\"ResourceReleased\", \"TerminatedWithoutReleaseResources\"\
    }\n\n\ndef application_result(application: dict) -> dict | None:\n    \"\"\"Return\
    \ a terminal result, or None. Resource cleanup alone is never success.\n\n   \
    \ Operator retries are disabled in our manifests. Airflow owns retries, so any\n\
    \    observed failure is definitive for this SparkApplication.\n    \"\"\"\n \
    \   status = application.get(\"status\") or {}\n    current = status.get(\"currentState\"\
    ) or {}\n    state = current.get(\"currentStateSummary\", \"Submitted\")\n   \
    \ if state == \"Succeeded\" or state in FAILURES:\n        return {\"status\"\
    : \"success\" if state == \"Succeeded\" else \"error\",\n                \"state\"\
    : state, \"message\": current.get(\"message\", \"\")}\n    if state not in TERMINATED:\n\
    \        return None\n    history = status.get(\"stateTransitionHistory\") or\
    \ {}\n    for _, event in sorted(history.items(), key=lambda item: int(item[0]),\
    \ reverse=True):\n        previous = event.get(\"currentStateSummary\")\n    \
    \    if previous == \"Succeeded\" or previous in FAILURES:\n            return\
    \ {\"status\": \"success\" if previous == \"Succeeded\" else \"error\",\n    \
    \                \"state\": previous, \"message\": event.get(\"message\", \"\"\
    )}\n    return {\"status\": \"error\", \"state\": state,\n            \"message\"\
    : \"Application terminated without a preserved success/failure state\"}\n"
