    \ contract.\"\"\"\n\nfrom copy import deepcopy\n\nfrom company_airflow.job import\
    \ JOB_PROFILES\n\n\nDEFAULT_SECRET_ENV = [\n    {\"name\": \"SQLSERVER_USER\"\
    , \"secret\": \"sqlserver-credentials\", \"key\": \"username\"},\n    {\"name\"\
    : \"SQLSERVER_PASSWORD\", \"secret\": \"sqlserver-credentials\", \"key\": \"password\"\
    },\n    {\"name\": \"AWS_ACCESS_KEY_ID\", \"secret\": \"seaweedfs-credentials\"\
    , \"key\": \"access_key\"},\n    {\"name\": \"AWS_SECRET_ACCESS_KEY\", \"secret\"\
    : \"seaweedfs-credentials\", \"key\": \"secret_key\"},\n]\n\n\ndef build_ingestion_configuration(\n\
