  company_airflow__hooks__kubernetes_job.py: "\"\"\"Thin Kubernetes batch Job client.\"\
    \"\"\nfrom kubernetes import client, config\nfrom kubernetes.client.exceptions\
    \ import ApiException\n\n\nclass KubernetesJobHook:\n    def __init__(self, namespace=\"\
    spark-lab\", in_cluster=True, kube_context=None):\n        self.namespace = namespace\n\
    \        if in_cluster:\n            config.load_incluster_config()\n        \
    \    self.api_client = client.ApiClient()\n        else:\n            self.api_client\
    \ = config.new_client_from_config(context=kube_context)\n        self.batch =\
    \ client.BatchV1Api(self.api_client)\n        self.core = client.CoreV1Api(self.api_client)\n\
    \n    def _dict(self, value):\n        return self.api_client.sanitize_for_serialization(value)\n\
    \n    def get(self, name):\n        return self._dict(self.batch.read_namespaced_job(name,\
    \ self.namespace, _request_timeout=(5, 30)))\n\n    def submit(self, body):\n\
    \        try:\n            return self._dict(self.batch.create_namespaced_job(self.namespace,\
    \ body, _request_timeout=(5, 30)))\n        except ApiException as error:\n  \
    \          if error.status != 409:\n                raise\n            existing\
    \ = self.get(body[\"metadata\"][\"name\"])\n            if existing.get(\"metadata\"\
    , {}).get(\"labels\", {}).get(\"app.kubernetes.io/managed-by\") != \"company-airflow\"\
    :\n                raise RuntimeError(\"Refusing to attach to a Kubernetes Job\
    \ owned by another client\") from error\n            return existing\n\n    def\
    \ delete(self, name):\n        try:\n            self.batch.delete_namespaced_job(\n\
    \                name, self.namespace, propagation_policy=\"Foreground\", _request_timeout=(5,\
    \ 30))\n        except ApiException as error:\n            if error.status !=\
    \ 404:\n                raise\n\n    def logs(self, name):\n        pods = self.core.list_namespaced_pod(\n\
    \            self.namespace, label_selector=f\"job-name={name}\", _request_timeout=(5,\
    \ 30))\n        for pod in pods.items:\n            yield pod.metadata.name, self.core.read_namespaced_pod_log(\n\
    \                pod.metadata.name, self.namespace, container=\"job\", tail_lines=500,\n\
    \                _request_timeout=(5, 30))\n"
  company_airflow__hooks__spark_kubernetes.py: "\"\"\"Thin client for the native Apache\
    \ Spark application API.\"\"\"\nfrom kubernetes import client, config\nfrom kubernetes.client.exceptions\
    \ import ApiException\n\nGROUP, VERSION, PLURAL = \"spark.apache.org\", \"v1\"\
    , \"sparkapplications\"\n\n\nclass SparkApplicationHook:\n    def __init__(self,\
    \ namespace=\"spark-lab\", in_cluster=True, kube_context=None):\n        self.namespace\
    \ = namespace\n        if in_cluster:\n            config.load_incluster_config()\n\
    \            api_client = client.ApiClient()\n        else:\n            api_client\
    \ = config.new_client_from_config(context=kube_context)\n        self.custom =\
    \ client.CustomObjectsApi(api_client)\n        self.core = client.CoreV1Api(api_client)\n\
    \n    def get(self, name):\n        return self.custom.get_namespaced_custom_object(\n\
    \            GROUP, VERSION, self.namespace, PLURAL, name, _request_timeout=(5,\
    \ 30))\n\n    def submit(self, body):\n        try:\n            return self.custom.create_namespaced_custom_object(\n\
    \                GROUP, VERSION, self.namespace, PLURAL, body, _request_timeout=(5,\
    \ 30))\n        except ApiException as error:\n            if error.status !=\
    \ 409:\n                raise\n            # Stable name provides reattachment\
    \ when a worker repeats a submission.\n            existing = self.get(body[\"\
    metadata\"][\"name\"])\n            if existing.get(\"metadata\", {}).get(\"labels\"\
    , {}).get(\"app.kubernetes.io/managed-by\") != \"company-airflow\":\n        \
    \        raise RuntimeError(\"Refusing to attach to a SparkApplication owned by\
    \ another client\") from error\n            return existing\n\n    def delete(self,\
    \ name):\n        try:\n            self.custom.delete_namespaced_custom_object(\n\
    \                GROUP, VERSION, self.namespace, PLURAL, name,\n             \
    \   body=client.V1DeleteOptions(propagation_policy=\"Foreground\"),\n        \
    \        _request_timeout=(5, 30))\n        except ApiException as error:\n  \
    \          if error.status != 404:\n                raise\n\n    def driver_logs(self,\
    \ name):\n        pods = self.core.list_namespaced_pod(\n            self.namespace,\
    \ label_selector=f\"company-run={name},spark-role=driver\",\n            _request_timeout=(5,\
    \ 30))\n        for pod in pods.items:\n            yield pod.metadata.name, self.core.read_namespaced_pod_log(\n\
    \                pod.metadata.name, self.namespace, container=\"spark-kubernetes-driver\"\
    ,\n                tail_lines=500, _request_timeout=(5, 30))\n"
