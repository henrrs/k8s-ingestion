  company_airflow__triggers__spark.py: "\"\"\"Wait for Spark without holding an Airflow\
    \ worker slot.\"\"\"\nimport asyncio\nimport time\n\nfrom airflow.triggers.base\
    \ import BaseTrigger, TriggerEvent\n\nfrom company_airflow.hooks.spark_kubernetes\
    \ import SparkApplicationHook\nfrom company_airflow.status import application_result\n\
    \n\nclass SparkApplicationTrigger(BaseTrigger):\n    def __init__(self, *, name,\
    \ namespace, deadline, poll_interval=10,\n                 in_cluster=True, kube_context=None):\n\
    \        super().__init__()\n        self.name = name\n        self.namespace\
    \ = namespace\n        self.deadline = deadline\n        self.poll_interval =\
    \ poll_interval\n        self.in_cluster = in_cluster\n        self.kube_context\
    \ = kube_context\n\n    def serialize(self):\n        return (\"company_airflow.triggers.spark.SparkApplicationTrigger\"\
    , {\n            \"name\": self.name, \"namespace\": self.namespace, \"deadline\"\
    : self.deadline,\n            \"poll_interval\": self.poll_interval, \"in_cluster\"\
    : self.in_cluster,\n            \"kube_context\": self.kube_context,\n       \
    \ })\n\n    async def run(self):\n        hook = await asyncio.to_thread(SparkApplicationHook,\
    \ self.namespace, self.in_cluster, self.kube_context)\n        errors = 0\n  \
    \      while time.time() < self.deadline:\n            try:\n                app\
    \ = await asyncio.to_thread(hook.get, self.name)\n                errors = 0\n\
    \                result = application_result(app)\n                if result:\n\
    \                    yield TriggerEvent({\"name\": self.name, **result})\n   \
    \                 return\n            except Exception as error:\n           \
    \     errors += 1\n                self.log.warning(\"Spark state lookup failed\
    \ (%s/6): %s\", errors, type(error).__name__)\n                if errors >= 6:\n\
    \                    yield TriggerEvent({\"name\": self.name, \"status\": \"error\"\
    , \"state\": \"MonitoringFailed\",\n                                        \"\
    message\": f\"Cannot query Kubernetes: {type(error).__name__}\"})\n          \
    \          return\n            await asyncio.sleep(self.poll_interval)\n     \
    \   # Deadline is persisted in trigger arguments, so a triggerer restart cannot\
    \ reset it.\n        try:\n            await asyncio.to_thread(hook.delete, self.name)\n\
    \            message = \"Spark execution timed out; application deletion requested\"\
    \n        except Exception as error:\n            message = f\"Spark execution\
    \ timed out; cleanup failed: {type(error).__name__}\"\n        yield TriggerEvent({\"\
    name\": self.name, \"status\": \"error\", \"state\": \"TimedOut\", \"message\"\
    : message})\n"
