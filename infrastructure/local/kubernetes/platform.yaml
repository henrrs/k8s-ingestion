    \ < self.deadline:\n            try:\n                result = job_result(await\
    \ asyncio.to_thread(hook.get, self.name))\n                errors = 0\n      \
    \          if result:\n                    yield TriggerEvent({\"name\": self.name,\
    \ **result})\n                    return\n            except Exception as error:\n\
    \                errors += 1\n                self.log.warning(\"Job state lookup\
