---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-data
  namespace: spark-lab
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: spark-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2025-latest@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1433
        resources:
          requests:
            cpu: 500m
            memory: 3Gi
          limits:
            memory: 4Gi
        env:
        - name: ACCEPT_EULA
          value: 'Y'
        - name: MSSQL_PID
          value: Developer
        - name: MSSQL_MEMORY_LIMIT_MB
          value: '3072'
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sqlserver-admin
              key: password
        volumeMounts:
        - name: data
          mountPath: /var/opt/mssql
        readinessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 20
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sqlserver-data
      securityContext:
        fsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: spark-lab
spec:
  selector:
    app: sqlserver
  ports:
  - port: 1433
    targetPort: 1433
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: spark-lab
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels: &id001
      app: oracle
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        fsGroup: 54321
      containers:
      - name: oracle
        image: gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
        imagePullPolicy: IfNotPresent
        ports:
        - name: listener
          containerPort: 1521
        env:
        - name: ORACLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oracle-admin
              key: password
        - name: APP_USER
          valueFrom:
            secretKeyRef:
              name: oracle-credentials
              key: username
        - name: APP_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oracle-credentials
              key: password
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - /opt/oracle/healthcheck.sh
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: spark-lab
spec:
  selector:
    app: oracle
  ports:
  - port: 1521
    targetPort: 1521
---
