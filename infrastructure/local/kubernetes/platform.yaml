    \ = None,\n        storage: dict[str, Any] | None = None,\n        metrics: dict[str,\
    \ Any] | None = None,\n        validation: dict[str, Any] | None = None,\n   \
    \     image: str = \"company-dlt-ingestion:0.6.0\",\n        compute_profile:\
    \ str = \"small\",\n        namespace: str = \"spark-lab\",\n        driver_service_account:\
