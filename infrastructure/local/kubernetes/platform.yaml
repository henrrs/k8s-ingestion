    \    compute_profile, namespace, worker_service_account, secret_env, env,\n  \
    \  timeout_seconds, workload_identity=False,\n):\n    # ``None`` preserves the\
    \ local-lab defaults.  An explicit empty list is a\n    # meaningful production\
    \ configuration: credentials are resolved by the\n    # runtime through workload\
    \ identity instead of Kubernetes Secrets.\n    secrets = deepcopy(DEFAULT_SECRET_ENV\
    \ if secret_env is None else secret_env)\n    worker_env = {\"AWS_REGION\": \"\
    us-east-1\", \"DLT_TELEMETRY\": \"false\"}\n    worker_env.update(env or {})\n\
    \    return {\n        \"source\": deepcopy(source),\n        \"destination\"\
