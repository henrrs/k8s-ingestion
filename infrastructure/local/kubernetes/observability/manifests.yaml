apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: spark-lab
data:
  prometheus.yml: "global:\n  scrape_interval: 10s\nscrape_configs:\n- honor_labels:\
    \ true\n  job_name: pushgateway\n  static_configs:\n  - targets:\n    - pushgateway:9091\n\
    - authorization:\n    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \  job_name: cadvisor\n  metric_relabel_configs:\n  - action: keep\n    regex:\
    \ spark-lab\n    source_labels:\n    - namespace\n  metrics_path: /api/v1/nodes/company-spark/proxy/metrics/cadvisor\n\
    \  scheme: https\n  static_configs:\n  - targets:\n    - kubernetes.default.svc:443\n\
    \  tls_config:\n    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability
  namespace: spark-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: company-observability
rules:
- apiGroups:
  - ''
  resources:
  - nodes/proxy
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: company-observability
subjects:
- kind: ServiceAccount
  name: observability
  namespace: spark-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: company-observability
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pushgateway-data
  namespace: spark-lab
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: spark-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
      - name: pushgateway
        image: prom/pushgateway:v1.11.3
        args:
        - --persistence.file=/data/metrics
        env: []
        ports:
        - containerPort: 9091
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 768Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pushgateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: spark-lab
spec:
  selector:
    app: pushgateway
  ports:
  - port: 9091
    targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: spark-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.14.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.retention.time=7d
        - --storage.tsdb.retention.size=300MB
        env: []
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 768Mi
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      serviceAccountName: observability
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: spark-lab
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
