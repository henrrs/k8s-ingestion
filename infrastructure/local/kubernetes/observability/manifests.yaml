apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: spark-lab
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  isDefault: true\n\
    \  name: Prometheus\n  type: prometheus\n  uid: prometheus\n  url: http://prometheus:9090\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-providers
  namespace: spark-lab
data:
  dashboards.yaml: "apiVersion: 1\nproviders:\n- name: Company Spark\n  options:\n\
    \    path: /etc/grafana/dashboards\n  type: file\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: spark-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:13.2.2
        args: []
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: password
        - name: GF_USERS_DEFAULT_THEME
          value: light
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: dashboards
          mountPath: /etc/grafana/dashboards
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: providers
          mountPath: /etc/grafana/provisioning/dashboards
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 768Mi
      volumes:
      - name: dashboards
        configMap:
          name: grafana-dashboard
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: providers
        configMap:
          name: grafana-providers
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: spark-lab
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history
  namespace: spark-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history
  template:
    metadata:
      labels:
        app: spark-history
    spec:
      containers:
      - name: spark-history
        image: company-spark-runtime:0.2.0
        args: []
        env:
        - name: SPARK_HISTORY_OPTS
          value: -Dspark.history.fs.logDirectory=s3a://spark-events/ -Dspark.hadoop.fs.s3a.endpoint=http://seaweedfs:8333
            -Dspark.hadoop.fs.s3a.path.style.access=true -Dspark.hadoop.fs.s3a.connection.ssl.enabled=false
            -Dspark.hadoop.fs.s3a.endpoint.region=us-east-1 -Dspark.hadoop.fs.s3a.aws.credentials.provider=software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider
        - name: SPARK_DAEMON_MEMORY
          value: 512m
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: seaweedfs-credentials
              key: access_key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: seaweedfs-credentials
              key: secret_key
        ports:
        - containerPort: 18080
        volumeMounts: []
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 768Mi
        command:
        - /opt/spark/bin/spark-class
        - org.apache.spark.deploy.history.HistoryServer
        imagePullPolicy: IfNotPresent
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history
  namespace: spark-lab
spec:
  selector:
    app: spark-history
  ports:
  - port: 18080
    targetPort: 18080
