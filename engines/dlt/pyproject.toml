[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-dlt-ingestion"
version = "0.6.0"
description = "Composable distributed ingestion engine using dltHub"
requires-python = ">=3.10"
dependencies = ["company-ingestion-core==0.3.0"]

[project.scripts]
company-dlt-ingestion = "company_dlt_ingestion.bootstrap.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../libraries/ingestion-core/src"]
