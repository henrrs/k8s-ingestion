[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-airflow-provider"
version = "0.4.0"
description = "Airflow operators for adaptive ingestion and Kubernetes workloads"
requires-python = ">=3.10"
dependencies = [
    "apache-airflow>=3.3.2,<4",
    "apache-airflow-providers-cncf-kubernetes>=10.22,<11",
    "kubernetes>=35,!=36.0.0,<37",
]

[project.entry-points.apache_airflow_provider]
provider_info = "company_airflow:get_provider_info"

[tool.setuptools.packages.find]
where = ["src"]
